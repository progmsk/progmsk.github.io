---
layout: default
---

<div class="row g-4">
  <div class="col-lg-8 mx-auto">
    <div class="vstack gap-4">
      <div class="card card-body">
        {% if page.image %}
        <img class="rounded img-fluid" src="{{ page.image }}" alt="{{ page.title | escape }}">
        {% endif %}
        <div class="mt-4">
          <h1 class="mb-2 h2">{{ page.title | escape }}</h1>
          <p><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="pe-1" style="vertical-align: -0.125em" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.445 11.688V6.354h-.633A12.6 12.6 0 0 0 4.5 7.16v.695c.375-.257.969-.62 1.258-.777h.012v4.61h.675zm1.188-1.305c.047.64.594 1.406 1.703 1.406 1.258 0 2-1.066 2-2.871 0-1.934-.781-2.668-1.953-2.668-.926 0-1.797.672-1.797 1.809 0 1.16.824 1.77 1.676 1.77.746 0 1.23-.376 1.383-.79h.027c-.004 1.316-.461 2.164-1.305 2.164-.664 0-1.008-.45-1.05-.82h-.684zm2.953-2.317c0 .696-.559 1.18-1.184 1.18-.601 0-1.144-.383-1.144-1.2 0-.823.582-1.21 1.168-1.21.633 0 1.16.398 1.16 1.23z"/><path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/></svg>{{ page.date | date: "%d.%m.%Y" }}</p>
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</div>

{% if page.videos %}
{% for video in page.videos %}
<div class="row g-4 mb-4">
  <div class="col-lg-8 mx-auto">
    <div class="card card-body p-0 rounded-end-lg-0 position-relative h-100">
      <div class="card-image">
        <div class="overflow-hidden fullscreen-video w-100">
          <div class="player-wrapper card-img-top overflow-hidden video">
            <iframe width="560" height="315" src="{{ video }}"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endfor %}
{% endif %}

{% if page.gallery %}
<div class="row g-4 mb-4">
  <div class="col-lg-8 mx-auto">
    <div class="row text-center text-lg-start">
      {% for image in page.gallery %}
      <div class="col-lg-3 col-md-3 col-6">
        <a href="{{ image }}" class="d-block mb-4 h-100" target="_blank">
          <img class="img-fluid img-thumbnail" src="{{ image }}" alt="{{ page.title | escape }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endif %}
